<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: emoji heart -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>" />

    <!-- App Meta -->
    <title>♥ we_love_merwan ♥</title>
    <meta name="description" content="A retro pop-art music tracking and playback app, made with love." />

    <!-- Preconnect to Google Fonts (loaded via CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:title"       content="♥ we_love_merwan ♥" />
    <meta property="og:description" content="A retro pop-art music tracking app, made with love." />
    <meta property="og:type"        content="website" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      The Spotify Web Playback SDK is loaded dynamically in App.jsx
      via a <script> tag injected at runtime, so it receives a fresh
      OAuth token each time. No static script tag needed here.
    -->

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
